<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mooring Line Equilibrium</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1d23; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }

  #sidebar {
    width: 320px; min-width: 320px; background: #22252e; border-right: 1px solid #333;
    display: flex; flex-direction: column; overflow-y: auto;
  }
  #sidebar h1 { font-size: 14px; font-weight: 600; color: #7ab8f5; padding: 14px 16px 10px; border-bottom: 1px solid #333; letter-spacing: 0.5px; }

  .section { padding: 12px 16px; border-bottom: 1px solid #2d3040; }
  .section-title { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }

  .field { margin-bottom: 10px; }
  .field > label { display: flex; justify-content: space-between; font-size: 12px; color: #bbb; margin-bottom: 4px; }
  .field > label span { color: #7ab8f5; font-weight: 600; }
  input[type=range] { width: 100%; accent-color: #7ab8f5; cursor: pointer; }
  input[type=number], input[type=text] {
    background: #1a1d23; border: 1px solid #444; color: #e0e0e0;
    padding: 5px 8px; border-radius: 4px; font-size: 12px; width: 100%;
  }
  input[type=number]:focus, input[type=text]:focus { outline: none; border-color: #7ab8f5; }

  /* Tab toggle */
  .tab-row { display: flex; gap: 0; margin-bottom: 10px; border-radius: 5px; overflow: hidden; border: 1px solid #444; }
  .tab-btn { flex: 1; background: #1a1d23; border: none; color: #888; padding: 6px; font-size: 11px; cursor: pointer; }
  .tab-btn.active { background: #2a3a50; color: #7ab8f5; font-weight: 600; }

  /* Anchor grid */
  .anchor-grid { display: grid; grid-template-columns: auto 1fr 1fr; gap: 5px 8px; align-items: center; }
  .anchor-grid .dot { width: 10px; height: 10px; border-radius: 50%; }
  .anchor-grid label { font-size: 11px; color: #888; }
  .anchor-coord { display: flex; gap: 4px; align-items: center; }
  .anchor-coord span { font-size: 11px; color: #666; white-space: nowrap; }
  .anchor-coord input { flex: 1; }
  .anchor-readout { font-size: 11px; color: #556; font-style: italic; margin-top: 4px; }

  /* Per-line controls */
  .line-ctrl { margin-bottom: 12px; padding: 8px; background: #1a1d23; border-radius: 6px; }
  .line-ctrl-header { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .line-ctrl-header .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .line-ctrl-header .lname { font-size: 12px; font-weight: 600; color: #ccc; }
  .line-ctrl-header .pretension { font-size: 11px; color: #666; margin-left: auto; }
  .line-ctrl-header .pretension.active { color: #7ab8f5; }
  .line-ctrl-row { display: flex; gap: 6px; align-items: center; }
  .line-ctrl-row input[type=range] { flex: 1; }
  .line-ctrl-row input[type=number] { width: 68px; flex-shrink: 0; }
  .slack-badge { font-size: 9px; font-weight: 700; color: #e06c6c; background: #3a2020; border-radius: 3px; padding: 1px 5px; margin-left: 4px; }

  /* Results */
  .tension-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .tension-card { background: #1a1d23; border-radius: 6px; padding: 7px; text-align: center; }
  .tension-card .label { font-size: 10px; color: #888; margin-bottom: 3px; }
  .tension-card .value { font-size: 16px; font-weight: 700; }
  .t1 .value { color: #e06c6c; }
  .t2 .value { color: #6ce0a0; }
  .t3 .value { color: #6cb8e0; }

  .line-details { margin-top: 8px; }
  .line-row { display: flex; gap: 4px; align-items: flex-start; margin-bottom: 5px; padding: 5px 6px; background: #1a1d23; border-radius: 5px; font-size: 11px; }
  .line-row .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 2px; }
  .line-row .ldata { display: flex; gap: 8px; flex-wrap: wrap; }
  .line-row .ldata span { color: #999; white-space: nowrap; }
  .line-row .ldata span b { color: #ddd; }

  .pos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .pos-card { background: #1a1d23; border-radius: 6px; padding: 7px; text-align: center; }
  .pos-card .label { font-size: 10px; color: #888; margin-bottom: 2px; }
  .pos-card .value { font-size: 13px; font-weight: 600; color: #e0c06c; }

  .btn { background: #7ab8f5; color: #1a1d23; border: none; padding: 7px 14px; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 4px; }
  .btn:hover { background: #5aa0e0; }
  .btn-ghost { background: #2a3a50; color: #7ab8f5; border: 1px solid #7ab8f550; }
  .btn-ghost:hover { background: #3a4a60; }
  .btn-sm { padding: 5px 10px; font-size: 11px; width: auto; margin-top: 0; }

  /* Canvas */
  #canvas-wrap { flex: 1; display: flex; position: relative; overflow: hidden; }
  canvas { display: block; cursor: default; flex: 1; }
  canvas.dragging { cursor: grabbing; }
  canvas.hover-floater { cursor: grab; }
  #hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 11px; color: #444; pointer-events: none; white-space: nowrap; }
  #residual-badge {
    position: absolute; top: 10px; left: 10px; font-size: 11px;
    background: #22252e; border: 1px solid #333; color: #888;
    padding: 4px 10px; border-radius: 12px; pointer-events: none;
  }
  #mode-badge {
    position: absolute; top: 10px; right: 10px; font-size: 11px;
    background: #22252e; border: 1px solid #333; color: #888;
    padding: 4px 10px; border-radius: 12px; pointer-events: none;
  }
</style>
</head>
<body>

<div id="sidebar">
  <h1>Mooring Line Equilibrium</h1>

  <!-- ── Anchor Setup ── -->
  <div class="section">
    <div class="section-title">Anchor Positions</div>
    <div class="tab-row">
      <button class="tab-btn active" id="tab-circle" onclick="setAnchorMode('circle')">Circle Preset</button>
      <button class="tab-btn" id="tab-manual" onclick="setAnchorMode('manual')">Manual</button>
    </div>

    <div id="anchor-circle">
      <div class="field">
        <label>Radius R (m) <span id="circR-val">5.0</span></label>
        <input type="range" id="circR" min="1" max="20" step="0.5" value="5">
      </div>
      <div class="field">
        <label>Start angle (°) <span id="circA-val">0</span></label>
        <input type="range" id="circA" min="0" max="359" step="1" value="0">
      </div>
      <div class="anchor-readout" id="circle-readout"></div>
    </div>

    <div id="anchor-manual" style="display:none;">
      <div class="anchor-grid" id="anchor-manual-grid"></div>
    </div>
  </div>

  <!-- ── Mooring Lines ── -->
  <div class="section">
    <div class="section-title">Mooring Lines</div>
    <div class="field">
      <label>Stiffness k <span id="k-val">500 N/m</span></label>
      <input type="range" id="k" min="10" max="5000" step="10" value="500">
    </div>
    <div id="line-controls"></div>
  </div>

  <!-- ── Results ── -->
  <div class="section">
    <div class="section-title">Results — Equilibrium State</div>
    <div class="tension-grid">
      <div class="tension-card t1"><div class="label">T₁ (N)</div><div class="value" id="T1-disp">—</div></div>
      <div class="tension-card t2"><div class="label">T₂ (N)</div><div class="value" id="T2-disp">—</div></div>
      <div class="tension-card t3"><div class="label">T₃ (N)</div><div class="value" id="T3-disp">—</div></div>
    </div>
    <div class="line-details" id="line-details"></div>
    <div class="pos-grid">
      <div class="pos-card"><div class="label">x (m)</div><div class="value" id="px-disp">—</div></div>
      <div class="pos-card"><div class="label">y (m)</div><div class="value" id="py-disp">—</div></div>
    </div>
  </div>

  <!-- ── Display ── -->
  <div class="section">
    <div class="section-title">Display</div>
    <div class="field">
      <label>Floater radius (m) <span id="fr-val">0.5</span></label>
      <input type="range" id="floaterR" min="0.1" max="2" step="0.1" value="0.5">
    </div>
    <div class="field" style="display:flex;align-items:center;gap:8px;">
      <label style="font-size:12px;color:#bbb;flex:1;">Show force vectors</label>
      <input type="checkbox" id="showForces" checked>
    </div>
    <div class="field">
      <label>Force scale <span id="fscale-val">1.0×</span></label>
      <input type="range" id="fscale" min="0.1" max="5" step="0.1" value="1">
    </div>
    <button class="btn btn-ghost" onclick="fitView()">Fit View</button>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="canvas"></canvas>
  <div id="residual-badge">|F_net| = 0.00 N</div>
  <div id="mode-badge">Equilibrium</div>
  <div id="hint">Drag floater to explore · Scroll to zoom</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// ── System State ──────────────────────────────────────────────────────────────
// Anchors: array of {x, y} in metres
let anchors = [
  { x: 5, y: 0 },
  { x: -2.5, y: 4.330127 },
  { x: -2.5, y: -4.330127 }
];

// Lines: one per anchor, {k, L0}
// Default: L0 = dist(anchor, origin) - 200/500 = 5 - 0.4 = 4.6 m (gives ~200 N pretension at origin)
let lines = [
  { k: 500, L0: 4.6 },
  { k: 500, L0: 4.6 },
  { k: 500, L0: 4.6 }
];

let floaterR = 0.5;
let showForces = true;
let forceScale = 1;

// Floater position (world coords, metres)
let floaterPos = { x: 0, y: 0 };

// Drag state
let drag = null;
let isDragging = false;

// Camera
let cam = { x: 0, y: 0, zoom: 50 };

// Anchor mode: 'circle' | 'manual'
let anchorMode = 'circle';
let circleR = 5, circleStartAngleDeg = 0;

const COLORS = ['#e06c6c', '#6ce0a0', '#6cb8e0'];

// ── Physics ───────────────────────────────────────────────────────────────────
function anchorDist(i, pos) {
  const a = anchors[i];
  const dx = a.x - pos.x, dy = a.y - pos.y;
  return Math.sqrt(dx * dx + dy * dy);
}

function springTension(i, pos) {
  const d = anchorDist(i, pos);
  return Math.max(0, lines[i].k * (d - lines[i].L0));
}

function springForce(i, pos) {
  const a = anchors[i];
  const dx = a.x - pos.x, dy = a.y - pos.y;
  const d = Math.sqrt(dx * dx + dy * dy);
  if (d < 1e-9) return { x: 0, y: 0 };
  const T = springTension(i, pos);
  return { x: T * dx / d, y: T * dy / d };
}

function totalForce(pos) {
  let fx = 0, fy = 0;
  for (let i = 0; i < anchors.length; i++) {
    const f = springForce(i, pos);
    fx += f.x; fy += f.y;
  }
  return { x: fx, y: fy };
}

// ── Solver — Newton-Raphson with damped steps ─────────────────────────────────
function solveEquilibrium(guess) {
  let pos = guess ? { ...guess } : { ...floaterPos };
  const eps = 1e-6, maxIter = 400, tol = 1e-8;

  // Bounding box: 3× the max anchor distance so we don't drift to infinity
  const maxDist = anchors.reduce((m, a) => Math.max(m, Math.sqrt(a.x*a.x + a.y*a.y)), 0);
  const bound = maxDist * 3 || 50;

  for (let iter = 0; iter < maxIter; iter++) {
    const F = totalForce(pos);
    if (Math.abs(F.x) < tol && Math.abs(F.y) < tol) break;

    // Numerical Jacobian
    const Fpx = totalForce({ x: pos.x + eps, y: pos.y });
    const Fpy = totalForce({ x: pos.x, y: pos.y + eps });
    const J11 = (Fpx.x - F.x) / eps, J12 = (Fpy.x - F.x) / eps;
    const J21 = (Fpx.y - F.y) / eps, J22 = (Fpy.y - F.y) / eps;

    const det = J11 * J22 - J12 * J21;
    if (Math.abs(det) < 1e-14) break;

    let dx = -(J22 * F.x - J12 * F.y) / det;
    let dy = -(-J21 * F.x + J11 * F.y) / det;

    // Damp: limit step to 0.3 m
    const stepLen = Math.sqrt(dx*dx + dy*dy);
    if (stepLen > 0.3) { dx *= 0.3 / stepLen; dy *= 0.3 / stepLen; }

    pos.x += dx;
    pos.y += dy;

    // Soft bounding
    const r = Math.sqrt(pos.x*pos.x + pos.y*pos.y);
    if (r > bound) { pos.x *= bound / r; pos.y *= bound / r; }
  }
  return pos;
}

// Centroid of anchors — good starting guess
function anchorCentroid() {
  let x = 0, y = 0;
  for (const a of anchors) { x += a.x; y += a.y; }
  return { x: x / anchors.length, y: y / anchors.length };
}

// ── Coordinate transforms ─────────────────────────────────────────────────────
function w2c(wx, wy) {
  return {
    x: canvas.width  / 2 + (wx - cam.x) * cam.zoom,
    y: canvas.height / 2 - (wy - cam.y) * cam.zoom
  };
}
function c2w(cx, cy) {
  return {
    x: (cx - canvas.width  / 2) / cam.zoom + cam.x,
    y: -(cy - canvas.height / 2) / cam.zoom + cam.y
  };
}

// ── Drawing ───────────────────────────────────────────────────────────────────
function drawArrow(x1, y1, x2, y2, color, lw) {
  lw = lw || 2;
  const dx = x2-x1, dy = y2-y1, len = Math.sqrt(dx*dx+dy*dy);
  if (len < 3) return;
  const ux = dx/len, uy = dy/len;
  const hw = Math.max(6, lw*3), hl = Math.max(10, lw*4.5);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2-ux*hl, y2-uy*hl);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2-ux*hl-uy*hw/2, y2-uy*hl+ux*hw/2);
  ctx.lineTo(x2-ux*hl+uy*hw/2, y2-uy*hl-ux*hw/2);
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
}

function drawGrid() {
  if (cam.zoom < 8) return;
  const left = c2w(0, 0).x, right = c2w(canvas.width, 0).x;
  const top  = c2w(0, 0).y, bottom = c2w(0, canvas.height).y;
  ctx.strokeStyle = '#22252f'; ctx.lineWidth = 1;
  for (let wx = Math.floor(left); wx <= right+1; wx++) {
    const p = w2c(wx, 0);
    ctx.beginPath(); ctx.moveTo(p.x, 0); ctx.lineTo(p.x, canvas.height); ctx.stroke();
  }
  for (let wy = Math.floor(bottom); wy <= top+1; wy++) {
    const p = w2c(0, wy);
    ctx.beginPath(); ctx.moveTo(0, p.y); ctx.lineTo(canvas.width, p.y); ctx.stroke();
  }
  ctx.strokeStyle = '#2d3245'; ctx.lineWidth = 1;
  const o = w2c(0, 0);
  ctx.beginPath(); ctx.moveTo(o.x, 0); ctx.lineTo(o.x, canvas.height); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, o.y); ctx.lineTo(canvas.width, o.y); ctx.stroke();
}

function drawNaturalLengthArc(i) {
  const L0 = lines[i].L0;
  if (L0 <= 0) return;
  const a = anchors[i];
  const ap = w2c(a.x, a.y);
  const rpx = L0 * cam.zoom;
  ctx.beginPath(); ctx.arc(ap.x, ap.y, rpx, 0, Math.PI * 2);
  ctx.strokeStyle = COLORS[i] + '20'; ctx.lineWidth = 1; ctx.setLineDash([3,8]); ctx.stroke();
  ctx.setLineDash([]);
}

function drawMooringLine(i, pos) {
  const a = anchors[i];
  const ap = w2c(a.x, a.y);
  const fp = w2c(pos.x, pos.y);
  const T = springTension(i, pos);
  const slack = T < 0.01;

  if (slack) {
    ctx.setLineDash([4, 5]);
    ctx.strokeStyle = COLORS[i] + '44';
    ctx.lineWidth = 1;
  } else {
    ctx.setLineDash([]);
    ctx.strokeStyle = COLORS[i];
    ctx.lineWidth = Math.max(1.5, Math.min(5, T / 80));
  }
  ctx.beginPath(); ctx.moveTo(fp.x, fp.y); ctx.lineTo(ap.x, ap.y); ctx.stroke();
  ctx.setLineDash([]);
}

function drawAnchor(i) {
  const a = anchors[i];
  const ap = w2c(a.x, a.y);
  // Ground hatch marks (indicate fixed point)
  const ang = Math.atan2(a.y, a.x); // direction from origin to anchor
  const perpX = Math.sin(ang), perpY = -Math.cos(ang);
  ctx.strokeStyle = COLORS[i] + '88'; ctx.lineWidth = 1.5;
  for (let t = -1; t <= 1; t++) {
    const ox = ap.x + perpX * t * 6, oy = ap.y + perpY * t * 6;
    const dir = { x: Math.cos(ang + 0.5), y: Math.sin(ang + 0.5) };
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox - dir.x*8, oy - dir.y*8); ctx.stroke();
  }
  // Circle
  ctx.beginPath(); ctx.arc(ap.x, ap.y, 10, 0, Math.PI * 2);
  ctx.fillStyle = COLORS[i] + '22'; ctx.fill();
  ctx.strokeStyle = COLORS[i]; ctx.lineWidth = 2; ctx.stroke();
  // Cross
  ctx.strokeStyle = COLORS[i]; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(ap.x-7, ap.y); ctx.lineTo(ap.x+7, ap.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ap.x, ap.y-7); ctx.lineTo(ap.x, ap.y+7); ctx.stroke();
  // Label: offset outward from centroid
  const cx = anchors.reduce((s,a)=>s+a.x,0)/anchors.length;
  const cy = anchors.reduce((s,a)=>s+a.y,0)/anchors.length;
  const dx = a.x - cx, dy = a.y - cy;
  const dl = Math.sqrt(dx*dx+dy*dy) || 1;
  const lp = w2c(a.x + dx/dl*0.7, a.y + dy/dl*0.7);
  ctx.fillStyle = COLORS[i]; ctx.font = 'bold 11px Segoe UI'; ctx.textAlign = 'center';
  ctx.fillText(`A${i+1}`, lp.x, lp.y + 4);
}

function drawFloater(pos) {
  const fp = w2c(pos.x, pos.y);
  const rpx = floaterR * cam.zoom;
  // Ripple
  ctx.beginPath(); ctx.arc(fp.x, fp.y, rpx + 7, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(100,180,255,0.1)'; ctx.lineWidth = 7; ctx.stroke();
  // Body
  ctx.beginPath(); ctx.arc(fp.x, fp.y, rpx, 0, Math.PI*2);
  const g = ctx.createRadialGradient(fp.x-rpx*0.3, fp.y-rpx*0.3, rpx*0.1, fp.x, fp.y, rpx);
  g.addColorStop(0, '#a0c8f0'); g.addColorStop(1, '#2a5070');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = '#7ab8f5'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#e0e0e0'; ctx.font = 'bold 11px Segoe UI'; ctx.textAlign = 'center';
  ctx.fillText('Floater', fp.x, fp.y + rpx + 15);
}

function drawForceVectors(pos) {
  const fp = w2c(pos.x, pos.y);
  const fscale = forceScale * cam.zoom * 0.003;
  for (let i = 0; i < anchors.length; i++) {
    const f = springForce(i, pos);
    const len = Math.sqrt(f.x*f.x + f.y*f.y);
    if (len < 0.01) continue;
    const ex = fp.x + f.x*fscale, ey = fp.y - f.y*fscale;
    drawArrow(fp.x, fp.y, ex, ey, COLORS[i], 2);
    const T = springTension(i, pos);
    ctx.fillStyle = COLORS[i]; ctx.font = 'bold 10px Segoe UI'; ctx.textAlign = 'center';
    ctx.fillText(`${T.toFixed(0)} N`, fp.x + f.x*fscale*0.5, fp.y - f.y*fscale*0.5 - 8);
  }
  // Net residual (should be ~0)
  const net = totalForce(pos);
  const netLen = Math.sqrt(net.x*net.x + net.y*net.y);
  if (netLen > 0.5) {
    const ex = fp.x + net.x*fscale, ey = fp.y - net.y*fscale;
    drawArrow(fp.x, fp.y, ex, ey, '#ff880080', 1.5);
    ctx.fillStyle = '#ff880080'; ctx.font = '10px Segoe UI'; ctx.textAlign = 'center';
    ctx.fillText(`net ${netLen.toFixed(1)} N`, fp.x + net.x*fscale*0.5, fp.y - net.y*fscale*0.5 - 8);
  }
}

function drawScaleBar() {
  const px = cam.zoom; // 1 metre
  const x = 16, y = canvas.height - 16;
  ctx.strokeStyle = '#666'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x+px, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y-4); ctx.lineTo(x, y+4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+px, y-4); ctx.lineTo(x+px, y+4); ctx.stroke();
  ctx.fillStyle = '#666'; ctx.font = '11px Segoe UI'; ctx.textAlign = 'left';
  ctx.fillText('1 m', x, y - 8);
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#1a1d23'; ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawGrid();

  // Natural length arcs
  for (let i = 0; i < anchors.length; i++) drawNaturalLengthArc(i);

  // Mooring lines (behind anchors)
  for (let i = 0; i < anchors.length; i++) drawMooringLine(i, floaterPos);

  // Anchors
  for (let i = 0; i < anchors.length; i++) drawAnchor(i);

  // Force vectors
  if (showForces) drawForceVectors(floaterPos);

  // Floater (on top)
  drawFloater(floaterPos);

  drawScaleBar();
  updateResultsUI();
}

// ── UI Updates ────────────────────────────────────────────────────────────────
function updateResultsUI() {
  const T = anchors.map((_, i) => springTension(i, floaterPos));
  document.getElementById('T1-disp').textContent = T[0] !== undefined ? T[0].toFixed(1) : '—';
  document.getElementById('T2-disp').textContent = T[1] !== undefined ? T[1].toFixed(1) : '—';
  document.getElementById('T3-disp').textContent = T[2] !== undefined ? T[2].toFixed(1) : '—';
  document.getElementById('px-disp').textContent = floaterPos.x.toFixed(3);
  document.getElementById('py-disp').textContent = floaterPos.y.toFixed(3);

  const net = totalForce(floaterPos);
  const netLen = Math.sqrt(net.x*net.x + net.y*net.y);
  const badge = document.getElementById('residual-badge');
  badge.textContent = `|F_net| = ${netLen.toFixed(3)} N`;
  badge.style.color = netLen > 0.5 ? '#e0a060' : '#60b860';

  document.getElementById('mode-badge').textContent = isDragging ? 'Free Drag' : 'Equilibrium';

  // Per-line detail rows
  const det = document.getElementById('line-details');
  det.innerHTML = '';
  for (let i = 0; i < anchors.length; i++) {
    const a = anchors[i];
    const dx = a.x - floaterPos.x, dy = a.y - floaterPos.y;
    const L = Math.sqrt(dx*dx + dy*dy);
    const ang = Math.atan2(dy, dx) * 180 / Math.PI;
    const slack = T[i] < 0.01;
    const row = document.createElement('div');
    row.className = 'line-row';
    row.innerHTML = `
      <div class="dot" style="background:${COLORS[i]}"></div>
      <div class="ldata">
        <span><b>${T[i].toFixed(1)}</b> N ${slack ? '<span class="slack-badge">SLACK</span>' : ''}</span>
        <span>L = <b>${L.toFixed(3)}</b> m</span>
        <span>L₀ = <b>${lines[i].L0.toFixed(3)}</b> m</span>
        <span>ΔL = <b>${(L - lines[i].L0).toFixed(3)}</b> m</span>
        <span>θ = <b>${ang.toFixed(1)}°</b></span>
      </div>`;
    det.appendChild(row);
  }

  // Update pretension hints in line controls
  for (let i = 0; i < anchors.length; i++) {
    const el = document.getElementById(`pretension-hint-${i}`);
    if (!el) continue;
    const a = anchors[i];
    const d0 = Math.sqrt(a.x*a.x + a.y*a.y);
    const pt = lines[i].k * (d0 - lines[i].L0);
    if (pt > 0) {
      el.textContent = `Pretension at origin: ${pt.toFixed(1)} N`;
      el.className = 'pretension active';
    } else {
      el.textContent = 'Slack at origin';
      el.className = 'pretension';
    }
  }
}

// ── Anchor Setup ──────────────────────────────────────────────────────────────
function applyCircleAnchors() {
  const R = circleR;
  const startRad = circleStartAngleDeg * Math.PI / 180;
  anchors = [0, 1, 2].map(i => {
    const ang = startRad + i * 2 * Math.PI / 3;
    return { x: R * Math.cos(ang), y: R * Math.sin(ang) };
  });
  document.getElementById('circle-readout').textContent =
    anchors.map((a, i) => `A${i+1}: (${a.x.toFixed(2)}, ${a.y.toFixed(2)})`).join('  ');
  rebuildLineCtrls();
  resolveAndRender();
}

function setAnchorMode(mode) {
  anchorMode = mode;
  document.getElementById('tab-circle').classList.toggle('active', mode === 'circle');
  document.getElementById('tab-manual').classList.toggle('active', mode === 'manual');
  document.getElementById('anchor-circle').style.display = mode === 'circle' ? '' : 'none';
  document.getElementById('anchor-manual').style.display = mode === 'manual' ? '' : 'none';
  if (mode === 'manual') buildManualAnchorGrid();
}

function buildManualAnchorGrid() {
  const grid = document.getElementById('anchor-manual-grid');
  grid.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    // Dot
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.background = COLORS[i];
    grid.appendChild(dot);
    // x input
    const xWrap = document.createElement('div');
    xWrap.className = 'anchor-coord';
    xWrap.innerHTML = `<span>x${i+1}</span>`;
    const xi = document.createElement('input');
    xi.type = 'number'; xi.step = '0.1'; xi.value = anchors[i].x.toFixed(2);
    xi.addEventListener('input', () => { anchors[i].x = parseFloat(xi.value)||0; resolveAndRender(); });
    xWrap.appendChild(xi);
    grid.appendChild(xWrap);
    // y input
    const yWrap = document.createElement('div');
    yWrap.className = 'anchor-coord';
    yWrap.innerHTML = `<span>y${i+1}</span>`;
    const yi = document.createElement('input');
    yi.type = 'number'; yi.step = '0.1'; yi.value = anchors[i].y.toFixed(2);
    yi.addEventListener('input', () => { anchors[i].y = parseFloat(yi.value)||0; resolveAndRender(); });
    yWrap.appendChild(yi);
    grid.appendChild(yWrap);
  }
}

// ── Line Controls ─────────────────────────────────────────────────────────────
function maxL0() {
  return anchors.reduce((m, a) => Math.max(m, Math.sqrt(a.x*a.x + a.y*a.y)), 0) * 1.2 || 20;
}

function rebuildLineCtrls() {
  const container = document.getElementById('line-controls');
  container.innerHTML = '';
  for (let i = 0; i < anchors.length; i++) {
    // Default L0: nominal distance minus a small pretension
    if (lines[i] === undefined) {
      const d = Math.sqrt(anchors[i].x**2 + anchors[i].y**2);
      const kv = lines[0] ? lines[0].k : 500;
      lines[i] = { k: kv, L0: Math.max(0, d - 200 / kv) };
    }

    const ml = maxL0();
    const wrap = document.createElement('div');
    wrap.className = 'line-ctrl';

    const hdr = document.createElement('div');
    hdr.className = 'line-ctrl-header';
    hdr.innerHTML = `
      <div class="dot" style="background:${COLORS[i]}"></div>
      <span class="lname">Line ${i+1}</span>
      <span class="pretension" id="pretension-hint-${i}"></span>`;
    wrap.appendChild(hdr);

    const row = document.createElement('div');
    row.className = 'line-ctrl-row';

    const slider = document.createElement('input');
    slider.type = 'range';
    slider.min = 0; slider.max = ml.toFixed(2); slider.step = 0.01;
    slider.value = lines[i].L0.toFixed(2);
    slider.id = `l0-slider-${i}`;

    const numIn = document.createElement('input');
    numIn.type = 'number';
    numIn.min = 0; numIn.max = ml.toFixed(2); numIn.step = 0.01;
    numIn.value = lines[i].L0.toFixed(2);
    numIn.id = `l0-num-${i}`;

    slider.addEventListener('input', () => {
      const v = parseFloat(slider.value);
      lines[i].L0 = v;
      numIn.value = v.toFixed(2);
      resolveAndRender();
    });
    numIn.addEventListener('input', () => {
      const v = parseFloat(numIn.value);
      if (isNaN(v)) return;
      lines[i].L0 = Math.max(0, Math.min(ml, v));
      slider.value = lines[i].L0.toFixed(2);
      resolveAndRender();
    });

    row.appendChild(slider);
    row.appendChild(numIn);
    wrap.appendChild(row);
    container.appendChild(wrap);
  }
}

// ── Solve & Render ────────────────────────────────────────────────────────────
function resolveAndRender(guess) {
  const g = guess || floaterPos;
  floaterPos = solveEquilibrium(g);
  render();
}

// ── Controls wiring ───────────────────────────────────────────────────────────
document.getElementById('circR').addEventListener('input', function() {
  circleR = parseFloat(this.value);
  document.getElementById('circR-val').textContent = circleR.toFixed(1);
  applyCircleAnchors();
  fitView();
});
document.getElementById('circA').addEventListener('input', function() {
  circleStartAngleDeg = parseFloat(this.value);
  document.getElementById('circA-val').textContent = circleStartAngleDeg;
  applyCircleAnchors();
});
document.getElementById('k').addEventListener('input', function() {
  const v = parseFloat(this.value);
  document.getElementById('k-val').textContent = v + ' N/m';
  lines.forEach(l => l.k = v);
  resolveAndRender();
});
document.getElementById('floaterR').addEventListener('input', function() {
  floaterR = parseFloat(this.value);
  document.getElementById('fr-val').textContent = floaterR.toFixed(1);
  render();
});
document.getElementById('showForces').addEventListener('change', function() {
  showForces = this.checked; render();
});
document.getElementById('fscale').addEventListener('input', function() {
  forceScale = parseFloat(this.value);
  document.getElementById('fscale-val').textContent = forceScale.toFixed(1) + '×';
  render();
});

// ── View ──────────────────────────────────────────────────────────────────────
function fitView() {
  // Bounding box of all anchors + floater
  const pts = [...anchors, floaterPos];
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of pts) {
    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
    minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
  }
  const spanX = (maxX - minX) || 2, spanY = (maxY - minY) || 2;
  const margin = 1.5;
  cam.x = (minX + maxX) / 2;
  cam.y = (minY + maxY) / 2;
  cam.zoom = Math.min(
    canvas.width  / (spanX * margin),
    canvas.height / (spanY * margin)
  );
  render();
}

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  fitView();
}
window.addEventListener('resize', resize);

// ── Drag floater ──────────────────────────────────────────────────────────────
function ptInFloater(wx, wy) {
  const dx = wx - floaterPos.x, dy = wy - floaterPos.y;
  const r = floaterR + Math.max(0.3, 15 / cam.zoom);
  return dx*dx + dy*dy < r*r;
}

canvas.addEventListener('mousemove', e => {
  const w = c2w(e.offsetX, e.offsetY);
  if (drag) {
    floaterPos.x = drag.sf.x + (w.x - drag.sw.x);
    floaterPos.y = drag.sf.y + (w.y - drag.sw.y);
    render();
  } else {
    canvas.className = ptInFloater(w.x, w.y) ? 'hover-floater' : '';
  }
});
canvas.addEventListener('mousedown', e => {
  const w = c2w(e.offsetX, e.offsetY);
  if (ptInFloater(w.x, w.y)) {
    drag = { sw: w, sf: { ...floaterPos } };
    isDragging = true;
    canvas.classList.add('dragging');
  }
});
canvas.addEventListener('mouseup', () => {
  drag = null;
  if (isDragging) {
    isDragging = false;
    floaterPos = solveEquilibrium(floaterPos);
    render();
  }
});
canvas.addEventListener('mouseleave', () => {
  drag = null;
  if (isDragging) {
    isDragging = false;
    floaterPos = solveEquilibrium(floaterPos);
    render();
  }
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0], rect = canvas.getBoundingClientRect();
  const w = c2w(t.clientX - rect.left, t.clientY - rect.top);
  if (ptInFloater(w.x, w.y)) {
    drag = { sw: w, sf: { ...floaterPos } };
    isDragging = true;
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!drag) return;
  const t = e.touches[0], rect = canvas.getBoundingClientRect();
  const w = c2w(t.clientX - rect.left, t.clientY - rect.top);
  floaterPos.x = drag.sf.x + (w.x - drag.sw.x);
  floaterPos.y = drag.sf.y + (w.y - drag.sw.y);
  render();
}, { passive: false });
canvas.addEventListener('touchend', () => {
  drag = null;
  if (isDragging) { isDragging = false; floaterPos = solveEquilibrium(floaterPos); render(); }
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  cam.zoom = Math.max(8, Math.min(800, cam.zoom * (e.deltaY < 0 ? 1.1 : 0.9)));
  render();
}, { passive: false });

// ── Init ──────────────────────────────────────────────────────────────────────
// Build initial circle readout
document.getElementById('circle-readout').textContent =
  anchors.map((a, i) => `A${i+1}: (${a.x.toFixed(2)}, ${a.y.toFixed(2)})`).join('  ');

rebuildLineCtrls();
resize();
</script>
</body>
</html>
